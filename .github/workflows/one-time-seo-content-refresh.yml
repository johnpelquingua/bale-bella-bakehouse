name: One-time Bale Bella SEO content refresh

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-seo-content-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify and extract refresh payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/bale-seo-payload.part{1,2,3,4,5,6} | tr -d '\r\n\t ' > /tmp/payload.b64
          test "$(wc -c < /tmp/payload.b64)" -eq 39592
          base64 --decode /tmp/payload.b64 > /tmp/content.tar.gz
          echo '7a42c0abd8ab1509816608e165ad24e1d20b76151e816f1a72a1dd028fce1bda  /tmp/content.tar.gz' | sha256sum -c --strict
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          with tarfile.open('/tmp/content.tar.gz','r:gz') as t:
              for m in t.getmembers():
                  p=Path(m.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit(f'Unsafe path: {m.name}')
              t.extractall('.')
          PY
          node --check content.js
          git diff --check

      - name: QA content pages, schemas, metadata and links
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,sys,urllib.parse,xml.etree.ElementTree as ET
          pages={
            'menu/index.html':'https://balebellabakehouse.com/menu/',
            'cookies/index.html':'https://balebellabakehouse.com/cookies/',
            'brownies/index.html':'https://balebellabakehouse.com/brownies/',
            'basque-cheesecake/index.html':'https://balebellabakehouse.com/basque-cheesecake/',
            'banana-loaf/index.html':'https://balebellabakehouse.com/banana-loaf/',
            'gift-boxes/index.html':'https://balebellabakehouse.com/gift-boxes/',
            'corporate-orders/index.html':'https://balebellabakehouse.com/corporate-orders/',
            'delivery-san-fernando-pampanga/index.html':'https://balebellabakehouse.com/delivery-san-fernando-pampanga/',
            'blog/index.html':'https://balebellabakehouse.com/blog/',
            'blog/how-to-store-fresh-baked-cookies/index.html':'https://balebellabakehouse.com/blog/how-to-store-fresh-baked-cookies/',
            'blog/basque-cheesecake-vs-regular-cheesecake/index.html':'https://balebellabakehouse.com/blog/basque-cheesecake-vs-regular-cheesecake/',
            'blog/dessert-gift-ideas-san-fernando-pampanga/index.html':'https://balebellabakehouse.com/blog/dessert-gift-ideas-san-fernando-pampanga/'}
          errors=[]; titles=set(); descs=set(); canons=set()
          class A(HTMLParser):
            def __init__(s): super().__init__();s.h1=0;s.title='';s.it=False;s.meta=[];s.links=[];s.details=0;s.ins=False;s.st='';s.ss=None;s.buf=[];s.scripts=[]
            def handle_starttag(s,t,a):
              a=dict(a);t=t.lower()
              if t=='h1':s.h1+=1
              if t=='title':s.it=True
              if t=='meta':s.meta.append(a)
              if t=='a' and a.get('href'):s.links.append(a['href'])
              if t=='details':s.details+=1
              if t=='script':s.ins=True;s.st=a.get('type','').lower();s.ss=a.get('src');s.buf=[]
            def handle_data(s,d):
              if s.it:s.title+=d
              if s.ins and not s.ss:s.buf.append(d)
            def handle_endtag(s,t):
              if t.lower()=='title':s.it=False
              if t.lower()=='script' and s.ins:s.scripts.append((s.st,s.ss,''.join(s.buf).strip()));s.ins=False
          def meta(a,n):
            return next((x.get('content','') for x in a.meta if x.get('name','').lower()==n), '')
          def canon(x):
            m=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',x,re.I) or re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',x,re.I)
            return m.group(1) if m else ''
          for f,want in pages.items():
            p=Path(f)
            if not p.exists():errors.append(f'{f}: missing');continue
            x=p.read_text(encoding='utf-8');a=A();a.feed(x);d=meta(a,'description').strip();c=canon(x);t=a.title.strip()
            if a.h1!=1:errors.append(f'{f}: H1 count {a.h1}')
            if not 120<=len(d)<=190:errors.append(f'{f}: description length {len(d)}')
            if c!=want:errors.append(f'{f}: bad canonical {c}')
            for v,s,l in [(t,titles,'title'),(d,descs,'description'),(c,canons,'canonical')]:
              if v in s:errors.append(f'{f}: duplicate {l}')
              s.add(v)
            if 'http://' in x.lower():errors.append(f'{f}: insecure URL')
            for label in ['Menu','Our Story','Location','Blog','Order']:
              if label not in x:errors.append(f'{f}: missing nav label {label}')
            for typ,src,b in a.scripts:
              if b and not src and typ not in {'application/ld+json','application/json'}:errors.append(f'{f}: executable inline JS')
              if b and typ=='application/ld+json':
                try:json.loads(b)
                except Exception as e:errors.append(f'{f}: JSON-LD {e}')
            if '"FAQPage"' in x and a.details<1:errors.append(f'{f}: FAQ schema without visible FAQ')
            for href in a.links:
              if href.startswith(('#','http://','https://','mailto:','tel:','javascript:','//')):continue
              q=urllib.parse.urlsplit(href).path
              if q=='/':target=Path('index.html')
              elif q.endswith('/'):target=Path(q.lstrip('/'))/'index.html'
              else:target=Path(q.lstrip('/'))
              if not target.exists():errors.append(f'{f}: broken link {href}')
          root=ET.parse('sitemap.xml').getroot();ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'};locs={e.text.strip() for e in root.findall('s:url/s:loc',ns)}
          wanted={'https://balebellabakehouse.com/'}|set(pages.values())
          if locs!=wanted:errors.append('sitemap URL set mismatch')
          if errors:
            print('\n'.join('- '+e for e in errors));sys.exit(1)
          print(f'QA passed for {len(pages)} content pages.')

      - name: Publish refreshed content and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/bale-seo-payload.part{1,2,3,4,5,6}
          git rm .github/workflows/one-time-seo-content-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh content pages, SEO, schemas and linked navigation'
          git push
