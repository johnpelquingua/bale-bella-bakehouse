name: One-time Bale Bella security hardening

on:
  push:
    branches: [main]
    paths:
      - 'security_patch.py'
      - '.github/workflows/security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply static-site security hardening
        run: python security_patch.py

      - name: Remove temporary generators and write-enabled workflows
        run: |
          git rm -f --ignore-unmatch security_patch.py seo_patch.py story_patch.py app.js styles.css
          git rm -f --ignore-unmatch .github/workflows/apply-seo.yml
          git rm -f --ignore-unmatch .github/workflows/security-hardening.yml

      - name: Commit hardened site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.css site.js SECURITY.md .gitignore .github/CODEOWNERS .well-known/security.txt .nojekyll
          if git diff --cached --quiet; then
            echo "No security changes to commit."
            exit 0
          fi
          git commit -m "Harden Bale Bella site and repository"
          git push
