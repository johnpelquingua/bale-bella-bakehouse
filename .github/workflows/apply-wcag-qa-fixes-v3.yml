name: Apply WCAG QA Fixes V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wcag-qa-fixes-v3.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run corrected remediation script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          workflow = Path('.github/workflows/apply-wcag-qa-fixes-v2.yml').read_text(encoding='utf-8')
          m = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          if not m:
              raise SystemExit('Could not extract V2 remediation Python block')
          script = textwrap.dedent(m.group(1))

          old_motion = 'function setMotion(e){motionEnabled=e,document.body.classList.toggle("motion-off",!e),document.documentElement.style.scrollBehavior=e?"smooth":"auto";const t=$("motionBtn");t.setAttribute("aria-pressed",String(e)),t.querySelector(".motion-label").textContent=e?"Motion On":"Motion Off";try{localStorage.setItem("bb_motion",e?"on":"off")}catch{}}function initMotion(){let e=null;try{e=localStorage.getItem("bb_motion")}catch{}setMotion("off"!==e)}'
          replacement = "old_motion = " + repr(old_motion) + "\nj = replace_once(j, old_motion, new_motion, 'motion replacement')"
          pattern = r"j, n = re\.subn\(r'function setMotion.*?\n\s*if n != 1: raise SystemExit\(f'motion replacement count \{n\}'\)"
          script, count = re.subn(pattern, lambda _: replacement, script, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected to replace one motion patch block, found {count}')

          Path('/tmp/remediate.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/remediate.py
          node --check site.js
      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site.js site.css
          git commit -m "Improve WCAG 2.2 accessibility and order QA"
          git push
