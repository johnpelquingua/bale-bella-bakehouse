name: One-time social ordering migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-social-ordering-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Migrate ordering channels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update Messenger and Instagram ordering
        shell: bash
        run: |
          set -euo pipefail
          python tools/migrate-social-ordering.py
          node --check site.js
          node --check content.js
          git diff --check
          # The GitHub Actions token cannot modify another workflow file.
          # Revert the permanent gate here; it will be updated separately through the GitHub connector.
          git checkout -- .github/workflows/security-gate.yml

      - name: Publish migration and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/migrate-social-ordering.py .github/workflows/one-time-social-ordering-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Route orders through Messenger and Instagram'
          git push
