name: One-time existing-page SEO optimization

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-existing-page-seo.yml']

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Optimize established pages only
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Corporate Dessert Orders in San Fernando, Pampanga | Bale Bella Bakehouse/Corporate Dessert Orders San Fernando | Bale Bella Bakehouse/' tools/optimize-existing-pages.py
          sed -i 's/Bakery Pickup \& Delivery in San Fernando, Pampanga | Bale Bella Bakehouse/Bakery Pickup \& Delivery San Fernando | Bale Bella Bakehouse/' tools/optimize-existing-pages.py
          python tools/optimize-existing-pages.py
          node --check site.js
          node --check content.js

      - name: Run strict SEO and page-freeze QA
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa-existing-pages.py
          git diff --check

      - name: Publish optimized existing pages and clean temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/optimize-existing-pages.py tools/qa-existing-pages.py .github/workflows/one-time-existing-page-seo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Deep-optimize established pages without expanding site structure'
          git push
