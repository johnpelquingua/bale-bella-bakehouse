name: ASCII Logo Apply
on:
  push:
    paths:
      - .github/workflows/ascii-logo-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply ASCII logo to page source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- BALE BELLA ASCII LOGO'
          if marker not in s:
              art = base64.b64decode('').decode('utf-8')
              author = '<!-- Author: Johnpel Quingua <johnpelquingua@gmail.com> -->'
              s = s.replace(author, author + '\n' + art, 1) if author in s else art + s
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate ASCII logo
        run: |
          grep -q 'BALE BELLA ASCII LOGO' index.html
          grep -q 'B A K E H O U S E' index.html
          grep -q 'FROM OUR BALE TO YOURS.' index.html
          grep -q 'johnpelquingua@gmail.com' index.html
      - name: Commit production change and remove temporary workflow
        run: |
          rm -f .github/workflows/ascii-logo-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/ascii-logo-apply.yml
          git commit -m 'Add Bale Bella ASCII logo to view-source'
          git push
