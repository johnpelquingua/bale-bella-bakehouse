name: Fix Reveal Contrast Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reveal-contrast.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Remove opacity fade from unrevealed meaningful content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          s=p.read_text(encoding='utf-8')
          old='.js .reveal:not(.visible){opacity:0;transform:translateY(20px)}'
          new='.js .reveal:not(.visible){opacity:1;transform:translateY(20px)}'
          if s.count(old)!=1:
              raise SystemExit(f'expected one reveal rule, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check site.js
      - name: Install isolated QA tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bb-reveal-qa && cd /tmp/bb-reveal-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Verify WCAG and content protection after fix
        shell: bash
        env:
          NODE_PATH: /tmp/bb-reveal-qa/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bb-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium }=require('playwright');
          const AxeBuilder=require('@axe-core/playwright').default;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let fail=0;
            try{
              for(const vp of [{n:'desktop',w:1440,h:1000},{n:'mobile',w:390,h:844},{n:'narrow-320',w:320,h:900}]){
                const ctx=await browser.newContext({viewport:{width:vp.w,height:vp.h}});
                const page=await ctx.newPage();
                await page.addInitScript(()=>{window.open=url=>({opener:null});window.confirm=()=>true;});
                await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
                await page.waitForSelector('#menuGrid .card');
                await page.locator('[data-add="mayumu"]').click();
                const protect=await page.evaluate(()=>({select:getComputedStyle(document.body).userSelect,input:getComputedStyle(document.querySelector('#customerName')).userSelect,fn:typeof window.initContentProtection==='function'}));
                if(protect.select!=='none'||protect.input!=='text'||!protect.fn){console.log('FAIL protection',vp.n,protect);fail++;}else console.log('PASS protection',vp.n);
                const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice']).analyze();
                if(axe.violations.length){fail++;console.log('FAIL axe',vp.n);for(const v of axe.violations){console.log(v.id,v.help);for(const n of v.nodes)console.log(n.target.join(' '),String(n.failureSummary||'').replace(/\n/g,' '));}}else console.log('PASS axe',vp.n);
                await ctx.close();
              }
            }finally{await browser.close();}
            if(fail)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-reveal-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.css .github/workflows/fix-reveal-contrast.yml
          git commit -m "Preserve WCAG contrast during reveal animations"
          git push
