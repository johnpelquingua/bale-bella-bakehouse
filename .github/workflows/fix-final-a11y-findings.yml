name: Fix Final Accessibility Findings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-a11y-findings.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply final WCAG fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old, new, 1)

          css = Path('site.css').read_text(encoding='utf-8')
          css = replace_once(
              css,
              '@keyframes itemIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}',
              '@keyframes itemIn{from{transform:translateY(7px)}to{transform:none}}',
              'meaningful content fade animation'
          )
          css = replace_once(
              css,
              '.gcash-top small{color:#66788e;margin-top:2px}',
              '.gcash-top small{color:#56687c;margin-top:2px}',
              'GCash secondary text contrast'
          )
          css = replace_once(
              css,
              '.page-cta-kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a56643}',
              '.page-cta-kicker{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#775746}',
              'CTA kicker contrast'
          )
          marker = '.accessibility-card a{color:var(--cocoa);font-weight:900}'
          if 'input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}' not in css:
              css = replace_once(
                  css,
                  marker,
                  marker + 'input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}',
                  'placeholder contrast rule'
              )
          Path('site.css').write_text(css, encoding='utf-8')

          js = Path('site.js').read_text(encoding='utf-8')
          old = 'const r=document.createElement("span");r.className="burst",r.textContent=e,r.style.left='
          new = 'const r=document.createElement("span");r.className="burst",r.setAttribute("aria-hidden","true"),r.textContent=e,r.style.left='
          js = replace_once(js, old, new, 'decorative burst accessibility')
          Path('site.js').write_text(js, encoding='utf-8')

          checks = {
              'no opacity in itemIn': 'itemIn{from{opacity:' not in css,
              'placeholder contrast': 'input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}' in css,
              'GCash text darkened': '.gcash-top small{color:#56687c' in css,
              'decorative burst hidden': 'r.setAttribute("aria-hidden","true")' in js,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Failed assertions: ' + ', '.join(failed))
          print('Final accessibility remediations applied.')
          PY
          node --check site.js
      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.css site.js
          git commit -m "Resolve final WCAG contrast and landmark findings"
          git push
