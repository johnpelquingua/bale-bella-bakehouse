name: ASCII Logo Source Signature
on:
  push:
    paths:
      - '.github/workflows/ascii-logo-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add Bale Bella ASCII source signature
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- BALE BELLA ASCII LOGO -->'
          if marker not in s:
              art = r'''<!-- BALE BELLA ASCII LOGO

                         /\
                    ____/  \____
                 .-'              '-.
               .'      BALE BELLA      '.
              /        +----+----+        \
             /         | [] | [] |         \
            /__________|____|____|__________\

                  B A K E H O U S E
                       EST 2026

                         .-.-.
                        (     )
                         \   /
                          \ /
                           V

                 FROM OUR BALE TO YOURS.

             Johnpel Quingua
             johnpelquingua@gmail.com

-->
'''
              author = '<!-- Author: Johnpel Quingua <johnpelquingua@gmail.com> -->'
              if author in s:
                  s = s.replace(author, author + '\n' + art, 1)
              else:
                  s = art + s
              p.write_text(s, encoding='utf-8')
      - name: Validate source signature
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = ['BALE BELLA ASCII LOGO','B A K E H O U S E','EST 2026','FROM OUR BALE TO YOURS.','Johnpel Quingua','johnpelquingua@gmail.com']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          print('ASCII source signature validated.')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/ascii-logo-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/ascii-logo-patch.yml
          git commit -m "Add Bale Bella ASCII logo source signature"
          git push
# trigger existing workflow
