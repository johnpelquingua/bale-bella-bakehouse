name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source read-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject sensitive file types and names
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(find . -path './.git' -prune -o -type f \( \
            -name '.env' -o -name '.env.*' -o \
            -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o \
            -name 'id_rsa' -o -name 'id_ed25519' -o \
            -name 'credentials.json' -o -name 'service-account*.json' \
          \) -print)"
          if [ -n "$bad_files" ]; then
            echo 'Sensitive-looking files must not be committed:'
            echo "$bad_files"
            exit 1
          fi
          echo 'No forbidden secret/private-key files found.'

      - name: Scan public source for high-confidence secrets
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          roots = [Path('index.html'), Path('site.js'), Path('site.css'), Path('robots.txt'), Path('sitemap.xml')]
          patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'AWS access key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'GitHub token': re.compile(r'gh[pousr]_[A-Za-z0-9]{30,}'),
              'Google API key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
              'Stripe live secret': re.compile(r'sk_live_[0-9A-Za-z]{20,}'),
              'OpenAI-style secret': re.compile(r'sk-[A-Za-z0-9_-]{24,}'),
          }

          findings = []
          for path in roots:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for label, rx in patterns.items():
                  for match in rx.finditer(text):
                      line = text.count('\n', 0, match.start()) + 1
                      findings.append(f'{path}:{line}: possible {label}')

          if findings:
              print('Potential secrets detected:')
              print('\n'.join(findings))
              sys.exit(1)
          print('No high-confidence secrets detected in published source.')

      - name: Validate JavaScript syntax and dangerous constructs
        shell: bash
        run: |
          set -euo pipefail
          node --check site.js
          if grep -En '\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\(' site.js; then
            echo 'Dangerous JavaScript construct detected.'
            exit 1
          fi
          echo 'JavaScript syntax and dangerous-construct check passed.'

      - name: Validate browser security contract
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys

          html = Path('index.html').read_text(encoding='utf-8')
          errors = []

          csp_match = re.search(
              r'<meta[^>]+http-equiv=["\']Content-Security-Policy["\'][^>]+content=["\']([^"\']+)',
              html,
              re.I,
          )
          if not csp_match:
              errors.append('Missing Content-Security-Policy meta policy')
          else:
              csp = csp_match.group(1).lower()
              required = [
                  "default-src 'self'",
                  "script-src 'self'",
                  "object-src 'none'",
                  "base-uri 'self'",
                  "form-action 'self'",
                  'upgrade-insecure-requests',
              ]
              for directive in required:
                  if directive not in csp:
                      errors.append(f'CSP missing required directive: {directive}')

          class ScriptAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.script_type = ''
                  self.script_src = None
                  self.inline_chunks = []
                  self.executable_inline = []
                  self.external_scripts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.script_type = attrs.get('type', '').lower()
                      self.script_src = attrs.get('src')
                      self.inline_chunks = []
                      if self.script_src:
                          self.external_scripts.append(self.script_src)
                  for key in attrs:
                      if key.lower().startswith('on'):
                          errors.append(f'Inline event handler found: {key}=')

              def handle_data(self, data):
                  if self.in_script and not self.script_src:
                      self.inline_chunks.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      body = ''.join(self.inline_chunks).strip()
                      non_executable = self.script_type in {'application/ld+json', 'application/json'}
                      if body and not non_executable:
                          self.executable_inline.append(body[:80])
                      self.in_script = False
                      self.script_type = ''
                      self.script_src = None
                      self.inline_chunks = []

          audit = ScriptAudit()
          audit.feed(html)

          if audit.executable_inline:
              errors.append('Executable inline JavaScript found; keep executable JS in site.js')

          for src in audit.external_scripts:
              if src.startswith(('http://', 'https://', '//')):
                  errors.append(f'External JavaScript source is not allowed: {src}')

          if re.search(r'\bhttp://', html, re.I):
              errors.append('Insecure http:// URL found in index.html')

          if errors:
              print('Security contract failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print('CSP, inline-script, event-handler, and external-script checks passed.')

      - name: Verify required production files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html site.css site.js logo.svg robots.txt sitemap.xml SECURITY.md .well-known/security.txt; do
            test -f "$file" || { echo "Missing required production/security file: $file"; exit 1; }
          done
          echo 'Required production and security files are present.'
