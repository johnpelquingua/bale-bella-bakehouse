name: Remove ASCII Source Signature
on:
  push:
    paths:
      - '.github/workflows/remove-ascii.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove Bale Bella ASCII source block
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new, count = re.subn(r'\n?<!-- BALE BELLA ASCII LOGO.*?-->\n?', '\n', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected 1 ASCII block, removed {count}')
          if 'BALE BELLA ASCII LOGO' in new:
              raise SystemExit('ASCII marker still present')
          p.write_text(new, encoding='utf-8')
      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-ascii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-ascii.yml
          git commit -m "Remove Bale Bella ASCII source signature"
          git push
