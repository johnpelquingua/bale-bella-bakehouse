name: One-time Pampanga service-area build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-service-areas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build approved service areas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate service-area pages and discovery updates
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-service-areas.py
          node --check site.js
          node --check content.js
          git diff --check

      - name: Publish build and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/build-service-areas.py .github/workflows/one-time-service-areas.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Build Pampanga bakery service-area pages'
          git push
