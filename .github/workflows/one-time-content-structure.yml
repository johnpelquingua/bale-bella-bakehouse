name: One-time Bale Bella homepage integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-content-structure.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('<a class="pill menu-link" href="#menu">Menu</a>', '<a class="pill menu-link" href="/menu/">Menu</a>'),
              ('<a class="pill" href="#how">How it works</a>', '<a class="pill" href="/blog/">Blog</a>'),
              ('"hasMenu":"https://balebellabakehouse.com/#menu"', '"hasMenu":"https://balebellabakehouse.com/menu/"'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Missing homepage patch target: {old}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate and publish
        run: |
          grep -F 'class="pill menu-link" href="/menu/"' index.html
          grep -F 'href="/blog/">Blog</a>' index.html
          grep -F '"hasMenu":"https://balebellabakehouse.com/menu/"' index.html
          rm -f .github/workflows/one-time-content-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-content-structure.yml
          git commit -m 'Link homepage to new content structure'
          git push
