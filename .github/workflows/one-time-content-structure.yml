name: One-time Bale Bella content structure build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-content-structure.yml']

permissions:
  contents: write

jobs:
  build-content-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build structure
        env:
          ARCHIVE_SHA256: a461441edbbe028dc072c1ce45ed024938b78770f018ddcea40103e267a11f3e
        run: |
          cat > /tmp/bale-content.b64 <<'B64'
          
          B64
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile, os
          encoded = Path('/tmp/bale-content.b64').read_text(encoding='utf-8')
          payload = base64.b64decode(''.join(encoded.split()))
          expected = os.environ['ARCHIVE_SHA256']
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Archive checksum mismatch: {actual} != {expected}')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tar:
              for member in tar.getmembers():
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              tar.extractall('.')
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ('<a class="pill menu-link" href="#menu">Menu</a>', '<a class="pill menu-link" href="/menu/">Menu</a>'),
              ('<a class="pill" href="#how">How it works</a>', '<a class="pill" href="/blog/">Blog</a>'),
              ('"hasMenu":"https://balebellabakehouse.com/#menu"', '"hasMenu":"https://balebellabakehouse.com/menu/"'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Required homepage patch target not found: {old}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate and publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = ['menu/index.html','cookies/index.html','brownies/index.html','basque-cheesecake/index.html','banana-loaf/index.html','gift-boxes/index.html','corporate-orders/index.html','delivery-san-fernando-pampanga/index.html','blog/index.html','blog/how-to-store-fresh-baked-cookies/index.html','blog/basque-cheesecake-vs-regular-cheesecake/index.html','blog/dessert-gift-ideas-san-fernando-pampanga/index.html','content.css','sitemap.xml','llms.txt']
          missing = [x for x in expected if not Path(x).is_file()]
          if missing:
              raise SystemExit('Missing generated files: ' + ', '.join(missing))
          index = Path('index.html').read_text(encoding='utf-8')
          assert 'href="/menu/">Menu</a>' in index
          assert 'href="/blog/">Blog</a>' in index
          assert '"hasMenu":"https://balebellabakehouse.com/menu/"' in index
          ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[e.text for e in ET.parse('sitemap.xml').findall('.//sm:loc',ns)]
          if len(locs)!=13 or len(locs)!=len(set(locs)):
              raise SystemExit(f'Unexpected sitemap count: {len(locs)}')
          print('Validated', len(expected)-3, 'new HTML pages and', len(locs), 'sitemap URLs')
          PY
          rm -f .github/workflows/one-time-content-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html content.css sitemap.xml llms.txt menu cookies brownies basque-cheesecake banana-loaf gift-boxes corporate-orders delivery-san-fernando-pampanga blog .github/workflows/one-time-content-structure.yml
          git commit -m 'Build Bale Bella SEO content structure'
          git push
