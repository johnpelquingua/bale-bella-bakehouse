name: Migrate Production URLs to Custom Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-custom-domain.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace legacy GitHub Pages URLs and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = 'https://johnpelquingua.github.io/bale-bella-bakehouse'
          NEW = 'https://balebellabakehouse.com'

          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if '.git' in p.parts or ('.github' in p.parts and 'workflows' in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if OLD in text:
                  p.write_text(text.replace(OLD, NEW), encoding='utf-8')
                  changed.append(str(p))

          required = {
              'index.html': [
                  '<link rel="canonical" href="https://balebellabakehouse.com/">',
                  '<link rel="describedby" href="https://balebellabakehouse.com/llms.txt" type="text/markdown">',
                  '<meta property="og:url" content="https://balebellabakehouse.com/">',
                  'https://balebellabakehouse.com/bale-bella-social-share.png',
                  'https://balebellabakehouse.com/#bakery',
                  'https://balebellabakehouse.com/#menu',
                  'https://balebellabakehouse.com/#order',
              ],
              'robots.txt': ['Sitemap: https://balebellabakehouse.com/sitemap.xml'],
              'sitemap.xml': ['<loc>https://balebellabakehouse.com/</loc>'],
              'llms.txt': [
                  'Canonical website: https://balebellabakehouse.com/',
                  '[Official Bale Bella Bakehouse website](https://balebellabakehouse.com/)',
                  '[XML sitemap](https://balebellabakehouse.com/sitemap.xml)',
              ],
              '.well-known/security.txt': ['Canonical: https://balebellabakehouse.com/.well-known/security.txt'],
          }

          for filename, needles in required.items():
              text = Path(filename).read_text(encoding='utf-8')
              if OLD in text:
                  raise SystemExit(f'Legacy production URL remains in {filename}')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing expected custom-domain value in {filename}: {needle}')

          # Remove the old one-off Pages redeploy marker now that Cloudflare Pages is production.
          marker = Path('.pages-redeploy')
          if marker.exists():
              marker.unlink()

          print('Updated URL-bearing files:')
          for item in changed:
              print(' -', item)
          PY

          node --check site.js

          # Remove obsolete one-time accessibility/remediation workflows.
          rm -f \
            .github/workflows/apply-wcag-qa-fixes.yml \
            .github/workflows/apply-wcag-qa-fixes-v2.yml \
            .github/workflows/apply-wcag-qa-fixes-v3.yml \
            .github/workflows/final-wcag-functional-qa.yml \
            .github/workflows/final-wcag-rerun.yml \
            .github/workflows/fix-final-a11y-findings.yml \
            .github/workflows/qa-a11y-audit.yml \
            .github/workflows/repair-wcag-workflow.yml

          # Self-delete: only the permanent Security Gate should remain afterward.
          rm -f .github/workflows/migrate-custom-domain.yml

      - name: Verify production domain migration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIl --exclude-dir=.git --exclude-dir=.github 'https://johnpelquingua.github.io/bale-bella-bakehouse' .
          grep -Fq '<link rel="canonical" href="https://balebellabakehouse.com/">' index.html
          grep -Fq '<meta property="og:url" content="https://balebellabakehouse.com/">' index.html
          grep -Fq 'https://balebellabakehouse.com/bale-bella-social-share.png' index.html
          grep -Fq 'Sitemap: https://balebellabakehouse.com/sitemap.xml' robots.txt
          grep -Fq '<loc>https://balebellabakehouse.com/</loc>' sitemap.xml
          grep -Fq 'Canonical website: https://balebellabakehouse.com/' llms.txt
          grep -Fq 'Canonical: https://balebellabakehouse.com/.well-known/security.txt' .well-known/security.txt
          test ! -e .pages-redeploy
          test -e .github/workflows/security-gate.yml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate production URLs to balebellabakehouse.com"
          git push
