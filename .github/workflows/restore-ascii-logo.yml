name: Restore ASCII Source Signature
on:
  push:
    paths:
      - '.github/workflows/restore-ascii-logo.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore Bale Bella ASCII source block without label
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          author = '<!-- Author: Johnpel Quingua <johnpelquingua@gmail.com> -->'
          head = s.split('<!doctype html>', 1)[0]
          if 'FROM OUR BALE TO YOURS.' in head:
              raise SystemExit('ASCII logo already present')
          lines = [
              '<!--',
              '',
              '                         /\\',
              '                    ____/  \\____',
              "                 .-'              '-.",
              "               .'      BALE BELLA      '.",
              '              /        +----+----+        \\',
              '             /         | [] | [] |         \\',
              '            /__________|____|____|__________\\',
              '',
              '                  B A K E H O U S E',
              '                       EST 2026',
              '',
              '                         .-.-.',
              '                        (     )',
              '                         \\   /',
              '                          \\ /',
              '                           V',
              '',
              '                 FROM OUR BALE TO YOURS.',
              '',
              '             Johnpel Quingua',
              '             johnpelquingua@gmail.com',
              '',
              '-->'
          ]
          logo = '\n'.join(lines)
          if author not in s:
              raise SystemExit('Author marker not found')
          s = s.replace(author, author + '\n' + logo, 1)
          if 'BALE BELLA ASCII LOGO' in s.split('<!doctype html>', 1)[0]:
              raise SystemExit('Unwanted label text found')
          p.write_text(s, encoding='utf-8')
      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore-ascii-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-ascii-logo.yml
          git commit -m "Restore Bale Bella ASCII logo without label text"
          git push
