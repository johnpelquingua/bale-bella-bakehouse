name: One-time social presence update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-social-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Add official social presence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add social profiles and follow section
        shell: bash
        run: |
          set -euo pipefail
          python tools/add-social-presence.py
          node --check site.js
          node --check content.js
          git diff --check

      - name: Publish update and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/add-social-presence.py .github/workflows/one-time-social-presence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Add official social media presence across Bale Bella'
          git push
