name: Apply Content Protection

on:
  workflow_run:
    workflows: ["Security Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  protect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add copy, print, source-view deterrence and Cloudflare security headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('site.js')
          css_path = Path('site.css')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          marker = 'initContentProtection'
          if marker not in js:
              snippet = r'''function initContentProtection(){const e=t=>!!t&&!!t.closest&&!!t.closest("input,textarea,select,[contenteditable='true'],#manualCopyText"),t=(e="Content protection is enabled on this site.")=>{"function"==typeof toast&&toast(e)},n=n=>{n.preventDefault(),t()};document.addEventListener("contextmenu",t=>{e(t.target)||n(t)},{capture:!0}),document.addEventListener("copy",t=>{e(t.target)||n(t)},{capture:!0}),document.addEventListener("cut",t=>{e(t.target)||n(t)},{capture:!0}),document.addEventListener("selectstart",t=>{e(t.target)||t.preventDefault()},{capture:!0}),document.addEventListener("dragstart",t=>{e(t.target)||t.preventDefault()},{capture:!0}),document.addEventListener("keydown",n=>{const o=String(n.key||"").toLowerCase(),c=n.ctrlKey||n.metaKey,a=e(n.target),i="f12"===o||c&&["u","s","p"].includes(o)||c&&n.shiftKey&&["i","j","c","k"].includes(o)||n.metaKey&&n.altKey&&["i","j","c"].includes(o)||c&&!a&&["c","a"].includes(o);i&&(n.preventDefault(),n.stopPropagation(),t("This browser action is disabled on this site."))},{capture:!0}),document.querySelectorAll("img").forEach(e=>e.setAttribute("draggable","false"));try{window.print=()=>t("Printing is disabled on this site.")}catch{}window.addEventListener("beforeprint",()=>document.documentElement.classList.add("print-blocked")),window.addEventListener("afterprint",()=>document.documentElement.classList.remove("print-blocked"))}initContentProtection();'''
              js = js.rstrip() + snippet + '\n'

          css_marker = 'body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}'
          if css_marker not in css:
              css = css.rstrip() + '\n' + 'body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea,select,[contenteditable="true"],#manualCopyText{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}img{-webkit-user-drag:none}@media print{html,body{background:#fff!important}body>*{display:none!important}body::before{display:block!important;content:"Printing is disabled for Bale Bella Bakehouse content.";font:700 18px/1.5 system-ui,sans-serif;color:#3f2a1e;padding:40px}}\n'

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

          headers = """/*
  Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; media-src 'self'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests
  X-Frame-Options: DENY
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()
  Cross-Origin-Opener-Policy: same-origin-allow-popups
  X-Permitted-Cross-Domain-Policies: none
"""
          Path('_headers').write_text(headers, encoding='utf-8')
          PY

          node --check site.js
          grep -F 'function initContentProtection()' site.js >/dev/null
          grep -F 'user-select:none' site.css >/dev/null
          grep -F "frame-ancestors 'none'" _headers >/dev/null
          grep -F 'X-Frame-Options: DENY' _headers >/dev/null
          grep -F 'X-Content-Type-Options: nosniff' _headers >/dev/null

      - name: Commit production protection and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-content-protection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js site.css _headers .github/workflows/apply-content-protection.yml
          git commit -m "Harden content against casual copying and printing"
          git push
